[package]
name = "myclock"
version = "1.0.0"
description = "My Clock - Minimal Flip Clock, Timer and Pomodoro"
authors = ["you"]
edition = "2021"

[lib]
name = "myclock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-notification = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

